{% extends "base.html" %}
{% block title %}Login • PHISHERMAN{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card card-shadow">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Sign in</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, msg in messages %}
              <div class="alert alert-{{ category }} mb-3">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}" class="vstack gap-3">
          <div>
            <label class="form-label">Username</label>
            <input name="username" class="form-control" autocomplete="username" required>
          </div>

          <div>
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" autocomplete="current-password" required>
          </div>

          <button class="btn btn-primary w-100" type="submit">
            Login
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
