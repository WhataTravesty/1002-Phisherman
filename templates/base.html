<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}PHISHERMAN{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    body { background: #f6f7fb; }
    .card-shadow { border: 0; box-shadow: 0 6px 18px rgba(16, 24, 40, .08); }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .dropzone {
      border: 2px dashed #cfd4dc;
      border-radius: 1rem;
      background: linear-gradient(180deg, #f8f9fb 0%, #fff 100%);
      padding: 2.5rem;
      text-align: center;
      cursor: pointer;
      transition: 150ms ease;
      position: relative;
    }
    .dropzone:hover { background: linear-gradient(180deg, #f1f3f7 0%, #fff 100%); }
    .dropzone.drop-active { outline: 3px solid rgba(13,110,253,.25); }
    .pill { font-size: .75rem; }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">
        <i class="bi bi-shield-check me-2"></i>PHISHERMAN
      </a>

      <div class="ms-auto d-flex gap-2">
        {% if current_user.is_authenticated %}
          <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('index') }}">
            <i class="bi bi-upload me-1"></i>Upload
          </a>
          <a class="btn btn-sm btn-primary" href="{{ url_for('dashboard') }}">
            <i class="bi bi-bar-chart me-1"></i>Dashboard
          </a>
          <a class="btn btn-sm btn-outline-danger" href="{{ url_for('logout') }}">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
          </a>
        {% else %}
          <a class="btn btn-sm btn-primary" href="{{ url_for('login') }}">
            <i class="bi bi-person me-1"></i>Login
          </a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
